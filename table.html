<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cards grouped by list</title>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
    <link rel="stylesheet" href="./table.css" />
  </head>
  <body>
    <header class="toolbar">
      <input id="search" class="search" type="search" placeholder="Filter cards&hellip;" autocomplete="off" />

      <details class="menu" id="menu-columns">
        <summary>Columns</summary>
        <div class="menu-body" id="columns-body"></div>
      </details>

      <details class="menu" id="menu-lists">
        <summary>Lists</summary>
        <div class="menu-body">
          <div class="menu-actions">
            <button type="button" data-lists="all">All</button>
            <button type="button" data-lists="none">None</button>
          </div>
          <div id="lists-body"></div>
        </div>
      </details>

      <label class="toggle">
        <input id="group-by-list" type="checkbox" />
        Group by list
      </label>

      <span class="spacer"></span>
      <span id="summary" class="summary"></span>
      <button id="reset" type="button" class="reset">Reset</button>
    </header>

    <main id="root" class="content">Loading&hellip;</main>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./table.js"></script>
  </body>
</html>
